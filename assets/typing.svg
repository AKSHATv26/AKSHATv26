<svg xmlns="http://www.w3.org/2000/svg" width="760" height="56" viewBox="0 0 760 56" role="img" aria-label="Build. Learn. Improve. Repeat. Good code, better decisions.">
  <style>
    .l{font-family:'Cascadia Code','Consolas','Courier New',monospace;font-size:24px;font-weight:700;opacity:0;animation:cycle 15s infinite}
    .l1{fill:#38d6ff;animation-delay:0s}.l2{fill:#f7d774;animation-delay:3s}.l3{fill:#e01e2b;animation-delay:6s}.l4{fill:#38d6ff;animation-delay:9s}.l5{fill:#f7d774;animation-delay:12s}
    .p{font-family:'Cascadia Code','Consolas','Courier New',monospace;font-size:24px;font-weight:700;fill:#8b9bb0}
    .c{fill:#bff4ff;animation:blink 1s steps(2) infinite}
    @keyframes cycle{0%{opacity:0;transform:translateY(8px)}3%{opacity:1;transform:translateY(0)}17%{opacity:1}20%{opacity:0}100%{opacity:0}}
    @keyframes blink{0%{opacity:1}100%{opacity:0}}
  </style>
  <text x="18" y="37" class="p">&gt;_</text>
  <text x="70" y="37" class="l l1">BUILD · ship full-stack and ML systems</text>
  <text x="70" y="37" class="l l2">LEARN · one Curiosity Series essay at a time</text>
  <text x="70" y="37" class="l l3">IMPROVE · govern AI before it executes</text>
  <text x="70" y="37" class="l l4">REPEAT · discipline creates freedom</text>
  <text x="70" y="37" class="l l5">GOOD CODE · BETTER DECISIONS</text>
  <rect x="736" y="16" width="12" height="26" class="c"/>
</svg>
