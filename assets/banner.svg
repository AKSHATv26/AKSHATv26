<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="Akshat Verma — AI Product Manager, AI Governance and Risk, Software and AI Engineering">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070b"/><stop offset=".55" stop-color="#0b1018"/><stop offset="1" stop-color="#16070a"/>
    </linearGradient>
    <radialGradient id="core" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".25" stop-color="#bff4ff"/><stop offset=".6" stop-color="#38d6ff" stop-opacity=".55"/><stop offset="1" stop-color="#38d6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" x2="1"><stop offset="0" stop-color="#f7d774"/><stop offset="1" stop-color="#c8962c"/></linearGradient>
    <linearGradient id="red" x1="0" x2="1"><stop offset="0" stop-color="#e01e2b"/><stop offset="1" stop-color="#7a0b12"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1d2a3a" stroke-width=".6"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="frame"><rect width="1200" height="340" rx="18"/></clipPath>
    <style>
      .t{font-family:'Segoe UI','Helvetica Neue',Arial,sans-serif}
      .spin{transform-origin:200px 170px;animation:spin 18s linear infinite}
      .spinr{transform-origin:200px 170px;animation:spin 26s linear infinite reverse}
      .pulse{transform-origin:200px 170px;animation:pulse 2.6s ease-in-out infinite}
      .scan{animation:scan 5s ease-in-out infinite}
      .blink{animation:blink 1.4s steps(2) infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes pulse{0%,100%{opacity:.75;transform:scale(.96)}50%{opacity:1;transform:scale(1.04)}}
      @keyframes scan{0%{transform:translateY(-20px);opacity:0}15%{opacity:.5}85%{opacity:.5}100%{transform:translateY(340px);opacity:0}}
      @keyframes blink{0%{opacity:1}100%{opacity:0}}
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)" opacity=".55"/>
    <rect class="scan" x="0" y="0" width="1200" height="2" fill="#38d6ff"/>
    <!-- reactor core -->
    <circle cx="200" cy="170" r="120" fill="url(#core)" class="pulse"/>
    <g class="spin" fill="none" stroke="#38d6ff" filter="url(#glow)">
      <circle cx="200" cy="170" r="104" stroke-width="2" stroke-dasharray="6 10" opacity=".8"/>
      <circle cx="200" cy="170" r="88" stroke-width="10" stroke-dasharray="22 9" opacity=".55"/>
    </g>
    <g class="spinr" fill="none" stroke="url(#gold)">
      <circle cx="200" cy="170" r="70" stroke-width="3" stroke-dasharray="40 14"/>
    </g>
    <circle cx="200" cy="170" r="52" fill="#071019" stroke="#bff4ff" stroke-width="3" filter="url(#glow)"/>
    <!-- shield crest -->
    <path d="M200 132 L232 144 L228 186 Q222 206 200 216 Q178 206 172 186 L168 144 Z" fill="url(#red)" stroke="url(#gold)" stroke-width="3"/>
    <text x="200" y="186" text-anchor="middle" class="t" font-size="30" font-weight="800" fill="#f7d774" letter-spacing="1">AV</text>
    <!-- HUD corners -->
    <g stroke="#38d6ff" stroke-width="2" fill="none" opacity=".7">
      <path d="M24 60V24H60"/><path d="M1140 24h36v36"/><path d="M24 280v36h36"/><path d="M1176 280v36h-36"/>
    </g>
    <!-- text -->
    <text x="380" y="92" class="t" font-size="15" letter-spacing="6" fill="#38d6ff">// IDENTITY CONFIRMED<tspan class="blink"> ▌</tspan></text>
    <text x="378" y="160" class="t" font-size="64" font-weight="800" letter-spacing="3" fill="#ffffff">AKSHAT VERMA</text>
    <rect x="380" y="178" width="120" height="5" fill="url(#red)"/><rect x="506" y="178" width="40" height="5" fill="url(#gold)"/>
    <text x="380" y="216" class="t" font-size="20" font-weight="600" letter-spacing="1.5" fill="url(#gold)">AI PRODUCT MANAGER · AI GOVERNANCE &amp; RISK · SOFTWARE &amp; AI ENGINEERING</text>
    <text x="380" y="252" class="t" font-size="15" letter-spacing="3" fill="#8b9bb0">ENTERPRISE AI · DECISION ASSURANCE · RESPONSIBLE AI · FULL-STACK &amp; ML SYSTEMS</text>
    <text x="380" y="296" class="t" font-size="14" font-weight="700" letter-spacing="5" fill="#e01e2b">DISCIPLINE BY SOUL · DRIVEN BY PURPOSE</text>
  </g>
  <rect x="1" y="1" width="1198" height="338" rx="18" fill="none" stroke="#1f3247" stroke-width="2"/>
</svg>
